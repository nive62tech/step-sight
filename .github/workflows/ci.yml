name: Build and deterministic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check services/api scripts
      - run: uv run pytest -q
  desktop:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DesktopGuide.slnx --locked-mode
      - run: dotnet build DesktopGuide.slnx --no-restore
      - run: dotnet test apps/desktop/DesktopGuide.Tests/DesktopGuide.Tests.csproj --no-build
      - run: dotnet test apps/desktop/DesktopGuide.AppTests/DesktopGuide.AppTests.csproj --no-build
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - shell: bash
        run: |
          terraform fmt -check -recursive infra
          for root in infra/aws/bootstrap infra/aws/pilot infra/gcp/inference; do
            terraform -chdir="$root" init -backend=false
            terraform -chdir="$root" validate
          done
