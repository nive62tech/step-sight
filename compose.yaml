name: desktop-guide
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: desktopguide
      POSTGRES_USER: desktopguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desktopguide -d desktopguide"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres-data:
