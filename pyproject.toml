[project]
name = "desktop-guide-api"
version = "0.1.0"
description = "Screen-grounded teaching API; local desktop owns all input authority"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "google-genai>=1.0,<3",
  "google-cloud-texttospeech>=2.25,<3",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]
asyncio_mode = "auto"
markers = ["postgres: requires an isolated PostgreSQL database", "live: explicitly enabled live provider tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
